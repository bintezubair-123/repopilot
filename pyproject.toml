[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "Multi-agent AI teammate for GitHub repos (CrewAI + RAG), free-tier friendly"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "crewai[google-genai,litellm]>=1.15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["streamlit>=1.57"]

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repopilot = ["config/*.yaml", "ui.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
